## 型を指示すれば定義が手に入る

> Patch.scala の traverse の定義が ValidatedNec に限定されちゃってるので Applicative に拡張して

.diff-rm[
```scala
enum Patch[+A] { // case Keep / case Clear / case Set(value: A)
* def traverse[B](f: A => ValidatedNec[String, B])
*     : ValidatedNec[String, Patch[B]] =
    this match {
*     case Keep   => Validated.validNec(Keep)
*     case Clear  => Validated.validNec(Clear)
*     case Set(a) => f(a).map(Set.apply)
    }
}
```
]

class: left, top

## 型を指示すれば定義が手に入る

> Patch.scala の traverse の定義が ValidatedNec に限定されちゃってるので Applicative に拡張して

.diff-add[
```scala
enum Patch[+A] { // case Keep / case Clear / case Set(value: A)
* def traverse[F[_], B](f: A => F[B])
*     (using F: Applicative[F]): F[Patch[B]] =
    this match {
*     case Keep   => F.pure(Keep)
*     case Clear  => F.pure(Clear)
*     case Set(a) => F.map(f(a))(Set.apply)
    }
}
```
]

ジェネリックな型ほど、書ける実装はほぼ 1 通りに決まります

**型を決めるのは人間、型を満たす実装は AI**

## 型レベルプログラミングも AI ならお手の物

> case class のフィールドの型に合わせて、CSV の行をパースして

```scala
inline def parseAll[T <: Tuple](cells: List[String])
    : Either[String, Tuple] =
  inline erasedValue[T] match {
    case _: EmptyTuple => Right(EmptyTuple)
    case _: (h *: t) =>
      for {
        a  <- summonInline[Parse[h]].parse(cells.head)
        as <- parseAll[t](cells.tail)
      } yield a *: as
  }

inline def parseRow[A](cells: List[String])
    (using m: Mirror.ProductOf[A]): Either[String, A] =
  parseAll[m.MirroredElemTypes](cells).map(m.fromProduct)
```

## ボイラープレートの話

AI が書いてくれるなら、ボイラープレートはもう問題にならない？

AI が読み書きする前提でも、デメリットは残ります

- **同期漏れ**: 同じ知識が N か所にあると、変更のたびに N か所すべてを直す必要があり、1 か所漏れれば不整合
- **コンテキストの浪費**: 冗長なコードがコンテキストを圧迫し、本当に大事な部分が埋もれる
- **自己増殖**: AI は既存のパターンを真似るので、冗長さが冗長さを呼ぶ
- **差分の肥大化**: 変更の意図が定型の差分に埋もれ、レビューが難しくなる

## Property Based Testing

100 個の例の代わりに、1 つの性質を書きます

```scala
forAll(genTotal, genWeights) { (total, weights) =>
  val allocated = allocate(total, weights)  // 金額を按分する

  allocated.size == weights.size &&
  allocated.sum  == total &&  // 合計は変わらない
  allocated.forall(_ >= 0)
}
```

- 人間が確認するのは「性質」と、入力を作る `Gen` だけ
- 境界値や組み合わせは、ScalaCheck が大量の入力で試してくれます
- ただし、性質が実装の写しになっていないかは人間が見る
    - 合計の保存、往復で元に戻る、などの不変条件は写しになりにくい

## 型による静的検査

テストで不正な値を弾く代わりに、不正な値を型で表現できなくします

```scala
type CodeType =
  NonEmpty And MaxSize[255] And MatchesRegex["[a-zA-Z0-9_-]+"]
type Code = String Refined CodeType

def register(code: Code, ...) = ...
```

- **篩型 (Refinement Types)**: 述語で値を絞り込んだ型
    - Scala では refined や iron で使えます
- 人間が確認するのは型定義の 1 行だけ
- 検証を忘れたコードは、そもそもコンパイルが通らない
- 代数的データ型 + 網羅性検査、opaque type、phantom type も同じ発想

## AI が生成器で型を取り違えたら

テキストのコード生成の場合

```scala
def genBinder(name: String): String =
  s"""given Binder[$name] with {
     |  def toDb(a: $name): Long = a.value.toString
     |}""".stripMargin
```

生成器はコンパイルが通り、生成されたファイルで初めてエラーになります

```text
-- [E007] Type Mismatch Error: UserIdBinder.scala:5:30
5 |  def toDb(a: UserId): Long = a.value.toString
  |                              ^^^^^^^^^^^^^^^^
  |                              Found:    String
  |                              Required: Long
```

## 静的検査 × Scalafix

型で表現しきれない規約は、lint のルールにします

```scala
class RefinedUnsafeFromLiteral
    extends SyntacticRule("RefinedUnsafeFromLiteral") {
  override def fix(implicit doc: SyntacticDocument): Patch =
    doc.tree.collect {
      case t @ Term.Apply.After_4_6_0(
            Term.Select(
              Term.Name(RefinedTypes()), Term.Name("unsafeFrom")),
            Term.ArgClause(List(LiteralOrBigLiteral()), None)) =>
        Patch.lint(Diagnostic("", "リテラルは apply で", t.pos))
    }.asPatch
}
```

AI への指示は忘れられますが、CI で動く lint のルールは忘れません
