## はじめに

静的な型付けを行う言語において、関数の制約を表現する方向性は二つあります。

一つは戻り値で制約を表現する方向

```scala
def max[A: Ordering](list: List[A]): Option[A]
```

もう一つは引数で制約を表現する方向

```scala
def max[A: Ordering](nel: NonEmptyList[A]): A
```

それでは、どういった時にどちらのケースを選択するべきでしょうか？

## 型の Cardinality

## 型の Cardinality

- `|Boolean|` は `2` です
    - 値は `true` か `false` のどちらかなので
- `|Byte|` は `256` です
    - 値は `-128` ～ `127` までの 256個なので
- `|Option[A]|` は `|A|+1` です
    - `A` 型の値の数だけ `Some` があり、さらに `None` で +1 という訳です
    - つまり `|Option[Boolean]|` であれば `3` ということですね
- `|Either[A, B]|` は `|A|+|B|` です
    - `A` 型の数だけ `Left` があり、`B` 型の数だけ `Right` があるからです
- `|NonEmptyList[A]|` は `|List[A]| -1` です
    - `|List[A]|` から空リストの 1 を除いた形になるからです

Refinement Types や Quotient Types などを用いて定義された型は、元になった型の Cardinal より小さい Cardinal になります。

## 関数の比較

それでは話を戻して元の関数を比較してみましょう

```scala
// 戻り値で制約を表現
def max[A: Ordering](list: List[A]): Option[A]
```

```scala
// 引数で制約を表現
def max[A: Ordering](nel: NonEmptyList[A]): A
```

前者の関数は、引数と戻り値の Cardinality がそれぞれ `|List[A]|` と `|A|+1` です

後者の関数は、引数と戻り値の Cardinality がそれぞれ `|List[A]| -1` と `|A|` です

## 関数の比較

それでは話を戻して元の関数を比較してみましょう

```scala
// 戻り値で制約を表現
def max[A: Ordering](list: List[A]): Option[A]
```

```scala
// 引数で制約を表現
def max[A: Ordering](nel: NonEmptyList[A]): A
```

前者の関数は、引数と戻り値の Cardinality がそれぞれ `|List[A]|` と `|A|+1` です

後者の関数は、引数と戻り値の Cardinality がそれぞれ `|List[A]| -1` と `|A|` です

関数 `A => B` を見た時、`|A|` が `|B|` それぞれ有限であれば、この関数が取りうる可能性は `|B|^|A|` と Cardinality の累乗で表現ができます。

## 関数の比較

それでは話を戻して元の関数を比較してみましょう

```scala
// 戻り値で制約を表現
def max[A: Ordering](list: List[A]): Option[A]
```

```scala
// 引数で制約を表現
def max[A: Ordering](nel: NonEmptyList[A]): A
```

前者の関数は、引数と戻り値の Cardinality がそれぞれ `|List[A]|` と `|A|+1` です

後者の関数は、引数と戻り値の Cardinality がそれぞれ `|List[A]| -1` と `|A|` です

関数 `A => B` を見た時、`|A|` が `|B|` それぞれ有限であれば、この関数が取りうる可能性は `|B|^|A|` と Cardinality の累乗で表現ができます。

`|List[A]|` は無限なのでそのまま単純に累乗するわけにはいきませんが、引数で制約を表現した方が関数の複雑性を減らせると考えることができます。

## 関数の比較

```scala
// 戻り値で制約を表現
def max[A: Ordering](list: List[A]): Option[A]
```

```scala
// 引数で制約を表現
def max[A: Ordering](nel: NonEmptyList[A]): A
```

従って、特に強い理由がない限りは、まず引数で制約を表現する関数からスタートする事が推奨できます。

## 関数の比較

```scala
// 戻り値で制約を表現
def max[A: Ordering](list: List[A]): Option[A]
```

```scala
// 引数で制約を表現
def max[A: Ordering](nel: NonEmptyList[A]): A
```

従って、特に強い理由がない限りは、まず引数で制約を表現する関数からスタートする事が推奨できます。

単体テストを書く場合においても、テストするバリエーションが少なくなり、その恩恵は関数を合成すればするほど指数的に影響して行きます。

class: left, top

## 関数の比較

また、引数で制約を表現する関数からスタートする事を推奨するもう一つの理由として、「戻り値で制約を表現する関数は、引数で制約を表現する関数をラップする事で簡単につくれる」というのがあります。

```scala
// 引数で制約を表現
def max[A: Ordering](nel: NonEmptyList[A]): A = ...
```


```scala
// 戻り値で制約を表現
def max2[A: Ordering](list: List[A]): Option[A] = 
  list.toNel.map(max)
```

---
class: left, top

## 関数の比較

逆に戻り値で制約を表現する関数からはじめて、後から引数で制約を表現する関数を定義しようとした場合、元のコードに手を加えるか、重複コードを受け入れるか、unsafe な操作をする必要がでてきてしまいます。

```scala
// 戻り値で制約を表現
def max[A: Ordering](list: List[A]): Option[A] = ...
```


```scala
// 引数で制約を表現
def max2[A: Ordering](nel: NonEmptyList[A]): A =
  max(nel.toList).get // !!! 危険 !!!!!!
```
