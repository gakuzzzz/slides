## はじめに

昨今のメジャーなプログラミング言語では、 `map` や `filter` , `flatMap` といった高階関数が当たり前のように標準実装されています。

しかしながら、SNS上ではこういった高階関数を使ったコードは可読性が低いとか読み辛いといった声もしばしば目にします。

このセッションでは、高階関数を使ったコードにおいて読みやすくなるケースと読みにくくなるケースについて紹介し、
なぜ読みにくく感じるのか読みやすくするためにはどのようにすれば良いのか、を紹介したいと思います。

class: left, top

## 高階関数への書き換え

まずこの変哲もない for 文から始めましょう

```typescript
const products: Product[] = ...

let result: Product[] = [];
for (const product of products) {
  if (product.price >= 5000 
        && product.stockStatus === 'Enough' 
        && product.releaseDate >= sub(today, {months: 2})) {
      const discountPrice = 
        product.price > 10000  ? product.price * 0.8
        : product.price > 8000 ? product.price * 0.9 
                               : product.price * 0.95;
      result = [...result, {...product, price: discountPrice}];
  }
}
```

# How と What の分離


---
class: left, top

## How と What の分離

プログラミング言語の進化の歴史は、いかに How を分離して What を端的に表現できるようにするか、の歴史でもあります。

---
class: left, top

## How と What の分離

プログラミング言語の進化の歴史は、いかに How を分離して What を端的に表現できるようにするか、の歴史でもあります。

どのようにデータを加工し作用を起こすかという流れのカタマリ（How）を切り出し、
適切な名前をつけてそれが何を表すのか（What）を明示することで、
プログラム全体の構造を把握しやすくするという事は普段から皆さん実施されている事だと思います。


---
class: left, top

## How と What の分離

プログラミング言語の進化の歴史は、いかに How を分離して What を端的に表現できるようにするか、の歴史でもあります。

どのようにデータを加工し作用を起こすかという流れのカタマリ（How）を切り出し、
適切な名前をつけてそれが何を表すのか（What）を明示することで、
プログラム全体の構造を把握しやすくするという事は普段から皆さん実施されている事だと思います。

`map` や `filter` などの集合操作に関する高階関数も、ループという具体的な手続き（How）を隠蔽し、絞り込みや投射といった目的（What）を表現できるように用意されています。

## How と What の分離

それを踏まえて先ほどのコードをもう一度見てみましょう

```typescript
const products: Product[] = ...

const result = products.filter(product => {
    return product.price >= 5000 
      && product.stockStatus === 'Enough' 
      && product.releaseDate >= sub(today, {months: 2});
  }).map(product => {
     const discountPrice = 
       product.price > 10000  ? product.price * 0.8
       : product.price > 8000 ? product.price * 0.9 
                              : product.price * 0.95;
     return {...product, price: discountPrice};
  });
```

---
class: left, top

## How と What の分離

ループという How が隠蔽されたにも関わらず What が端的に表されていないため、中途半端に How が分断された形になっているわけです。

```typescript
const products: Product[] = ...

const result = products.filter(product => {
    return product.price >= 5000 
      && product.stockStatus === 'Enough' 
      && product.releaseDate >= sub(today, {months: 2});
  }).map(product => {
     const discountPrice = 
       product.price > 10000  ? product.price * 0.8
       : product.price > 8000 ? product.price * 0.9 
                              : product.price * 0.95;
     return {...product, price: discountPrice};
  });
```

class: left, top

## How と What の分離

割引可能かどうかという判定と、割引を適用する処理にそれぞれ名前を付け What を明示します。

```typescript
const canDiscount = (product: Product) =>
  product.price >= 5000 
    && product.stockStatus === 'Enough' 
    && product.releaseDate >= sub(today, {months: 2});

const discount = (product: Product) => {
  const discountPrice = 
    product.price > 10000  ? product.price * 0.8
    : product.price > 8000 ? product.price * 0.9 
                           : product.price * 0.95;
  return {...product, price: discountPrice};
}
```


---
class: left, top

## How と What の分離

そうすることで利用側は、割引が適用可能な商品に対して割引した一覧を返す、という What が一目瞭然になりました。

```typescript
const products: Product[] = ...

const result = products
  .filter(canDiscount)
  .map(discount);
```

---
class: left, top

## How と What の分離

そうすることで利用側は、割引が適用可能な商品に対して割引した一覧を返す、という What が一目瞭然になりました。

```typescript
const products: Product[] = ...

const result = products
  .filter(canDiscount)
  .map(discount);
```

逆に言うと、どのような商品が割引可能なのか、割引はどれだけ値引きされるのかといった詳細は、ここからは直接読み取れなくなります。



---
class: left, top

## How と What の分離

`map` や `filter` などの集合操作の高階関数は、ループという具体的な How を隠蔽し、そのコードで表したい What を宣言的に書けるようにします。


---
class: left, top

## How と What の分離

`map` や `filter` などの集合操作の高階関数は、ループという具体的な How を隠蔽し、そのコードで表したい What を宣言的に書けるようにします。

したがって、What が上手く読み取れない状態のまま高階関数を使ってしまうと、
中途半端に How が隠蔽された上で What もよくわからないコードになってしまい、読み難いという印象になります。


---
class: left, top

## How と What の分離

`map` や `filter` などの集合操作の高階関数は、ループという具体的な How を隠蔽し、そのコードで表したい What を宣言的に書けるようにします。

したがって、What が上手く読み取れない状態のまま高階関数を使ってしまうと、
中途半端に How が隠蔽された上で What もよくわからないコードになってしまい、読み難いという印象になります。

How と What を適切に分離することで、集合操作の高階関数を使ってコードの意図や目的をより判りやすくすることができます。

## 性能の話

How と What が分離されることで、What を宣言的に記述する事ができるためそのコードの意図や目的は読み取りやすくなりました。

しかし逆に言うと、 How が隠蔽されるため、性能特性についてなどは却って読み取り辛くなる場合があります。

例えば TypeScript で不用意に `Array` の `map` を沢山チェーンさせたりしてしまうと中間状態の `Array` が沢山できてしまい、
for ループで書くよりメモリを多く消費してしまうなんていう事もあります。

```typescript
const products: Product[] = ...
const names = products
  .map(p => p.name)              // 不要な Array が生成される
  .map(n => n.toUpperCase());

```

## 性能の話

高階関数によってループを分離した事によって、並列化によるパフォーマンスチューニングが簡単になる側面もあります。

```scala
// Java
List<Product> products = ...
var result = products
  .parallelStream()                // データ構造として並列Streamを利用
  .map(p -> p.heavyCalculation())  // 簡単に重い処理を並列で実行できる
  .toList();
```
